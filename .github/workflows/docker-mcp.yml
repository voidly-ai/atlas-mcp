name: Docker MCP smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Build reviewed Dockerfile
        run: docker build --tag atlas-mcp:ci .
      - name: Check stdio MCP protocol without network access
        run: node test/docker-mcp-smoke.mjs atlas-mcp:ci
